<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px;" id="productDetail">
        <!-- Rendered by JS -->
    </div>

    <!-- Modals & Cart -->
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1400; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(4px);"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const productDetail = document.getElementById('productDetail');

            if (!productId || typeof products === 'undefined') {
                productDetail.innerHTML = '<h2>Product not found.</h2>';
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) {
                productDetail.innerHTML = '<h2>Product not found.</h2>';
                return;
            }

            let selectedSize = 'A5';

            const render = () => {
                productDetail.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; @media(max-width: 900px){ grid-template-columns: 1fr; }">
                        <div class="reveal" style="aspect-ratio: 3/4; overflow: hidden; border-radius: var(--radius-lg);">
                            <img src="${product.image}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="reveal" style="display: flex; flex-direction: column; gap: 32px;">
                            <div>
                                <span style="font-size: 0.9rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">${product.category}</span>
                                <h1 style="font-size: 3.5rem; margin-top: 12px;">${product.title}</h1>
                            </div>

                            <p style="color: var(--text-muted); line-height: 1.8;">
                                Museum-grade fine art print on heavy 250 GSM paper. Featuring deep blacks, vivid colors, and a matte finish for a truly premium feel. Shipped in a secure protective tube.
                            </p>

                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <label style="font-weight: 700;">Choose Print Size</label>
                                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                                    ${Object.keys(SIZES).map(s => `
                                        <button class="filter-pill size-selector ${selectedSize === s ? 'active' : ''}" data-size="${s}">
                                            ${SIZES[s].label} — ₹${SIZES[s].price}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="glass" style="padding: 24px; border-radius: var(--radius-md);">
                                <h3 style="color: var(--secondary); margin-bottom: 8px;">🔥 Special Offer</h3>
                                <p style="font-size: 0.9rem; color: var(--text-muted);">Buy 5 Posters, Get 1 Free! (Buy 7 Get 2, Buy 10 Get 3). Discount scales automatically.</p>
                            </div>

                            <div style="display: flex; gap: 20px; margin-top: 12px;">
                                <button id="addToBag" class="btn btn-primary" style="flex: 1;">Add to Bag</button>
                                <button id="buyNow" class="btn" style="border: 1px solid var(--border-glass);">Buy Now</button>
                            </div>
                        </div>
                    </div>
                `;

                productDetail.querySelectorAll('.size-selector').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedSize = btn.dataset.size;
                        render();
                    });
                });

                document.getElementById('addToBag')?.addEventListener('click', () => {
                    addProduct(product, selectedSize);
                    showToast(`"${product.title}" added to bag!`);
                    updateNavbarBadge();
                    toggleCart(true);
                });

                document.getElementById('buyNow')?.addEventListener('click', () => {
                    addProduct(product, selectedSize);
                    window.location.href = 'checkout.html';
                });

                initScrollReveal();
            };

            render();
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
        });
    </script>
</body>
</html>
