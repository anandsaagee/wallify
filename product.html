<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px;" id="productDetail">
        <!-- Rendered by JS -->
    </div>

    <!-- Modals & Cart -->
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const productDetail = document.getElementById('productDetail');

            if (!productId || typeof products === 'undefined') {
                productDetail.innerHTML = '<h2>Product not found.</h2>';
                return;
            }

            const product = products.find(p => p.id === productId);
            if (!product) {
                productDetail.innerHTML = '<h2>Product not found.</h2>';
                return;
            }

            let selectedSize = null;

            const render = () => {
                const canContinue = selectedSize !== null;
                productDetail.innerHTML = `
                    <div class="responsive-grid-product">
                        <div class="reveal" style="aspect-ratio: 3/4; overflow: hidden; border-radius: var(--radius-lg); background: #000;">
                            ${loadImage(product.image, product.title)}
                        </div>
                        <div class="reveal" style="display: flex; flex-direction: column; gap: 32px;">
                            <div>
                                <span style="font-size: 0.9rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">${product.category}</span>
                                <h1 style="font-size: clamp(2rem, 8vw, 3.5rem); margin-top: 12px; color: #FFFFFF;">${product.title}</h1>
                            </div>

                            <p style="color: #E5E7EB; line-height: 1.8; font-size: 1.1rem;">
                                Museum-grade fine art print on heavy 250 GSM archival paper. Featuring deep blacks, vivid colors, and a premium matte finish. Shipped in a secure protective tube.
                            </p>

                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <label style="font-weight: 700; color: #FFFFFF;">Choose Print Size <span style="color: var(--error);">*</span></label>
                                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
                                    ${Object.keys(SIZES).map(s => `
                                        <button class="filter-pill size-selector ${selectedSize === s ? 'active' : ''}" data-size="${s}" style="border: 1px solid ${selectedSize === s ? 'var(--primary)' : 'var(--border-glass)'}; height: 50px; display: flex; align-items: center; justify-content: center;">
                                            ${SIZES[s].label} — ₹${SIZES[s].price}
                                        </button>
                                    `).join('')}
                                </div>
                                ${!canContinue ? `<p style="font-size: 0.85rem; color: var(--secondary); font-weight: 600;">Please select a size to continue</p>` : ''}
                            </div>

                            <div class="glass" style="padding: 24px; border-radius: var(--radius-md); border: 1px solid rgba(250, 204, 21, 0.2); background: rgba(250, 204, 21, 0.05);">
                                <h3 style="color: var(--secondary); margin-bottom: 8px; font-size: 1.1rem;"><i class="fas fa-gift"></i> Special Bundle Offers</h3>
                                <ul style="font-size: 0.85rem; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px; list-style: none; padding: 0;">
                                    <li>✨ Buy 5 -> 1 Free</li>
                                    <li>✨ Buy 7 -> 2 Free</li>
                                    <li>✨ Buy 10 -> 3 Free</li>
                                    <li>✨ Buy 20 -> 6 Free</li>
                                </ul>
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 12px;">
                                <button id="addToBag" class="btn btn-primary" style="width: 100%; height: 56px;" ${!canContinue ? 'disabled' : ''}>
                                    ${canContinue ? 'Add to Bag' : 'Select Size First'}
                                </button>
                                <button id="buyNow" class="btn btn-buy-now" style="width: 100%;" ${!canContinue ? 'disabled' : ''}>
                                    Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                productDetail.querySelectorAll('.size-selector').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedSize = btn.dataset.size;
                        render();
                    });
                });

                document.getElementById('addToBag')?.addEventListener('click', () => {
                    addProduct(product, selectedSize);
                    showToast(`"${product.title}" added to bag!`);
                    updateNavbarBadge();
                    toggleCart(true);
                });

                document.getElementById('buyNow')?.addEventListener('click', () => {
                    addProduct(product, selectedSize);
                    window.location.href = 'checkout.html';
                });

                initScrollReveal();
            };

            render();
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
        });
    </script>
</body>
</html>
