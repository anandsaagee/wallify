<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Details | Wallify Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-layout { display: grid; grid-template-columns: 1fr; gap: 40px; }
        @media (min-width: 768px) { .product-layout { grid-template-columns: 1.2fr 1fr; gap: 80px; } }

        .product-gallery { position: relative; border-radius: 20px; overflow: hidden; background: #000; border: 1px solid var(--border-color); }
        .product-gallery img { width: 100%; transition: transform 0.4s ease; }
        
        .option-label { display: block; margin-bottom: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .selector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .selector-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #FFF; padding: 14px 10px; border-radius: 12px;
            font-size: 0.9rem; font-weight: 500; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .selector-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        
        .whatsapp-btn { background: #25D366; color: #FFF; width: 100%; padding: 18px; border-radius: 30px; font-weight: 700; margin-top: 1rem; border: none; font-size: 1rem; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2); transition: 0.3s; }
        .whatsapp-btn:hover { background: #128C7E; transform: translateY(-3px); box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4); }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="navbar reveal">
        <div class="container nav-content">
            <a href="index.html" class="logo">Wallify<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="collections.html">Collections</a>
                <a href="shop.html">Shop</a>
            </div>
            <button class="cart-trigger" id="cartToggleBtn">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="container py-120" style="margin-top: 70px;">
        <div id="productContainer" class="product-layout">
            <!-- Dynamically populated -->
        </div>
    </main>

    <!-- SIDE CART -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel"></div>

    <!-- SCRIPTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script type="module">
        import { getCart, calculateTotals, addToCart } from './cart.js';
        import { renderCartPanel, toggleCart } from './ui.js';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('productContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const product = window.products?.find(p => p.id === productId);

            if (!product) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 100px;"><h2>Poster Not Found</h2><a href="shop.html">Return to Shop</a></div>`;
                return;
            }

            let currentSize = 'A5';
            let currentQty = 1;
            const sizePrices = { 'A5': 33, 'A4': 49, 'A3': 99 };

            function render() {
                container.innerHTML = `
                    <div class="product-gallery reveal">
                        <img id="mainImg" src="${product.image}" alt="${product.title}">
                    </div>
                    <div class="product-info reveal" style="transition-delay: 0.1s;">
                        <span style="color: var(--accent-color); font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;">${product.category}</span>
                        <h1 style="font-size: clamp(2rem, 5vw, 3rem); margin: 0.5rem 0 1.5rem;">${product.title}</h1>
                        <div id="priceDisplay" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 2rem;">₹${sizePrices[currentSize] * currentQty}</div>
                        
                        <p style="color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.8;">
                           Gallery-quality poster printed on 300gsm acid-free paper. Ships in protective tube packaging. High-resolution digital art curation.
                        </p>

                        <div class="option-label">Select Size</div>
                        <div class="selector-grid" id="sizeSelector">
                            <div class="selector-btn ${currentSize === 'A5' ? 'active' : ''}" data-val="A5">A5</div>
                            <div class="selector-btn ${currentSize === 'A4' ? 'active' : ''}" data-val="A4">A4</div>
                            <div class="selector-btn ${currentSize === 'A3' ? 'active' : ''}" data-val="A3">A3</div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button id="addCartBtn" class="btn-primary" style="flex: 1; padding: 18px; font-size: 1rem; border-radius: 30px;">Add to Bag</button>
                            <button id="waBtn" class="whatsapp-btn" style="flex: 1;">Buy Now <i class="fab fa-whatsapp"></i></button>
                        </div>

                        <div style="margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid var(--border-color); display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-truck" style="margin-right: 8px;"></i> Delivered in 4-6 Days</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-certificate" style="margin-right: 8px;"></i> Museum-Grade Paper</div>
                        </div>
                    </div>
                `;

                // Re-bind listeners
                container.querySelectorAll('#sizeSelector .selector-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentSize = btn.dataset.val;
                        render();
                    });
                });

                container.querySelector('#addCartBtn').addEventListener('click', () => {
                    addToCart(product, currentSize, sizePrices[currentSize]);
                    toggleCart(true);
                });

                container.querySelector('#waBtn').addEventListener('click', () => {
                    const msg = encodeURIComponent(`Hi Wallify, I'd like to order:
Poster: ${product.title}
Size: ${currentSize}
Quantity: ${currentQty}
Price: ₹${sizePrices[currentSize] * currentQty}

Please confirm my order.`);
                    window.open(`https://wa.me/919497242251?text=${msg}`);
                });

                // Zoom logic
                const img = document.getElementById('mainImg');
                const gallery = img.parentElement;
                gallery.addEventListener('mousemove', (e) => {
                    const x = e.offsetX / gallery.offsetWidth * 100;
                    const y = e.offsetY / gallery.offsetHeight * 100;
                    img.style.transformOrigin = `${x}% ${y}%`;
                    img.style.transform = 'scale(1.5)';
                });
                gallery.addEventListener('mouseleave', () => {
                    img.style.transform = 'scale(1)';
                });

                // Reveal animations
                setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('active')), 50);
            }

            // Sync Cart State
            function updateBadge() {
                const totals = calculateTotals();
                document.getElementById('cartBadge').textContent = totals.totalItems;
                renderCartPanel('cartPanel');
            }

            document.getElementById('cartToggleBtn').addEventListener('click', () => toggleCart(true));
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
            renderCartPanel('cartPanel');
            updateBadge();
            window.addEventListener('cart_sync', updateBadge);

            render();
        });
    </script>
</body>
</html>
