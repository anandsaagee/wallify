<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404: Page Not Found | WallifyStore</title>
  <meta name="description" content="The page or poster you're looking for was moved or does not exist. Browse our collection of 1,400+ aesthetic wall posters." />
  <meta name="robots" content="noindex, follow" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #facb15;
      background: rgba(250, 203, 21, 0.1);
      border: 1px solid rgba(250, 203, 21, 0.2);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #facb15;
      color: #000000;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 9999px;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }
    .links {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 500px;
    }
    .category-link {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      transition: all 0.15s ease;
    }
    .category-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #facb15;
      border-color: rgba(250, 203, 21, 0.3);
    }
  </style>
</head>
<body>
  <div class="badge">404 Error</div>
  <h1>Poster Not Found</h1>
  <p>The wall art print you're searching for might have been moved, renamed, or is temporarily out of print.</p>
  <a href="/" class="btn">Explore All Wall Posters →</a>

  <div class="links">
    <a href="/category/anime" class="category-link">Anime Posters</a>
    <a href="/category/automotive" class="category-link">Car Posters</a>
    <a href="/category/mollywood" class="category-link">Malayalam Posters</a>
    <a href="/category/hollywood" class="category-link">Movie Posters</a>
    <a href="/category/football" class="category-link">Football Posters</a>
    <a href="/category/quotes" class="category-link">Motivational Posters</a>
  </div>
</body>
</html>
