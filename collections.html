<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container page-content">
        <div style="margin-bottom: 60px; text-align: center;">
            <h1 style="font-size: clamp(2rem, 8vw, 3rem); margin-bottom: 12px; line-height: 1.2;">Our Collections</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">Each piece is selected to tell a story or celebrate a passion. Explore curated themes for your space.</p>
        </div>

        <div class="poster-grid" id="collectionGrid">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Modals & Cart -->
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>
        const CATEGORIES = [
            { name: 'Automotive', sub: 'High-Octane Art' },
            { name: 'Aesthetic', sub: 'Vibrant Modern Vibes' },
            { name: 'Mollywood', sub: 'Cinematic Legends' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('collections');
            
            const grid = document.getElementById('collectionGrid');

            grid.innerHTML = CATEGORIES.map(cat => {
                const catProducts = window.products.filter(p => p.category === cat.name);
                const randomPoster = catProducts[Math.floor(Math.random() * catProducts.length)];
                return `
                    <a href="shop.html?category=${cat.name}" class="poster-card reveal" style="cursor: pointer;">
                        <div class="card-img-wrap">
                            <img src="${randomPoster ? randomPoster.image : ''}" alt="${cat.name}" loading="lazy">
                            <div class="card-overlay" style="opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                                <h3 class="card-title">${cat.name}</h3>
                                <p style="font-size: 0.8rem; color: var(--secondary);">${cat.sub}</p>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            initScrollReveal();
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
        });
    </script>
</body>
</html>
