<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px;">
        <div style="margin-bottom: 60px; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 12px;">Our Collections</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto;">Each piece is selected to tell a story or celebrate a passion. Explore curated themes for your space.</p>
        </div>

        <div class="poster-grid" id="collectionGrid">
            <!-- Automotive -->
            <a href="shop.html?category=Automotive" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="assets/automotive/AM%20%20001.jpg" alt="Automotive">
                    <div class="card-overlay" style="opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                        <h3 class="card-title">Automotive</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">High Octane Art</p>
                    </div>
                </div>
            </a>
            <!-- Classic Cars -->
            <a href="shop.html?category=Classic Cars" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1000" alt="Classic Cars">
                    <div class="card-overlay">
                        <h3 class="card-title">Classic Cars</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">Vintage Speed</p>
                    </div>
                </div>
            </a>
            <!-- Mollywood -->
            <a href="shop.html?category=Mollywood" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=1600" alt="Mollywood">
                    <div class="card-overlay">
                        <h3 class="card-title">Mollywood</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">Cinema Legends</p>
                    </div>
                </div>
            </a>
            <!-- Football -->
            <a href="shop.html?category=Football" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1551958219-acbc608c6377?auto=format&fit=crop&q=80&w=1000" alt="Football">
                    <div class="card-overlay">
                        <h3 class="card-title">Football</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">The Pitch Warriors</p>
                    </div>
                </div>
            </a>
            <!-- Anime -->
            <a href="shop.html?category=Anime" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&q=80&w=1000" alt="Anime">
                    <div class="card-overlay">
                        <h3 class="card-title">Anime</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">Otaku Dreams</p>
                    </div>
                </div>
            </a>
            <!-- Aesthetic -->
            <a href="shop.html?category=Aesthetic" class="poster-card reveal">
                <div class="card-img-wrap">
                    <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&q=80&w=1000" alt="Aesthetic">
                    <div class="card-overlay">
                        <h3 class="card-title">Aesthetic</h3>
                        <p style="font-size: 0.8rem; color: var(--secondary);">Vibrant Vibes</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Modals & Cart -->
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1400; opacity: 0; pointer-events: none; transition: 0.3s; backdrop-filter: blur(4px);"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('collections');
            initScrollReveal();
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
        });
    </script>
</body>
</html>
