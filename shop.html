<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Wallify Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .shop-header {
            padding: 160px 0 80px;
            text-align: center;
            background: radial-gradient(circle at top center, rgba(30,30,30,1) 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .shop-layout {
            display: flex;
            gap: 50px;
            padding-bottom: 80px;
            margin-top: 60px;
        }

        .shop-sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        .filter-section {
            margin-bottom: 32px;
            background: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .filter-section h3 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
        }

        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            font-size: 0.95rem;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
        }

        .filter-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .filter-item.active {
            background: rgba(255,215,0,0.07);
            color: var(--accent-color);
            font-weight: 500;
            border-color: rgba(255,215,0,0.2);
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 30px;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        /* ── From Index (Premium UI) ── */
        .product-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.5);
        }

        /* ── Side Cart Panel (Shared) ── */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }
        .cart-overlay.open { opacity: 1; visibility: visible; }
        .cart-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 400px; max-width: 90%; height: 100%;
            background: #0D0D0E;
            z-index: 2001;
            box-shadow: -10px 0 50px rgba(0,0,0,0.8);
            transition: right 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.05);
        }
        .cart-panel.open { right: 0; }

        @media (max-width: 900px) {
            .shop-layout { flex-direction: column; }
            .shop-sidebar { width: 100%; }
            .cart-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="navbar reveal">
        <a href="index.html" class="logo">Wallify<span style="color:#FFF">.</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
        </div>
        <div class="nav-icons">
            <button class="cart-icon" id="cartToggle" aria-label="View cart">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-count">0</span>
            </button>
            <button class="hamburger" id="hamburger" aria-label="Open menu">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="shop-header">
        <div class="container reveal">
            <h1 class="section-title">The Collection</h1>
            <p class="section-subtitle">Discover our complete range of premium quality posters.</p>
        </div>
    </header>

    <!-- MAIN SHOP AREA -->
    <section class="container shop-layout">
        <aside class="shop-sidebar reveal">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search artworks...">
            <div class="filter-section">
                <h3>Categories</h3>
                <div class="filter-list" id="categoryFilters">
                    <div class="filter-item active" data-cat="All">All Collections</div>
                    <div class="filter-item" data-cat="Automotive Posters">Automotive</div>
                    <div class="filter-item" data-cat="Mollywood">Mollywood</div>
                    <div class="filter-item" data-cat="Aesthetic">Aesthetic</div>
                    <div class="filter-item" data-cat="Anime">Anime</div>
                    <div class="filter-item" data-cat="Football">Football</div>
                    <div class="filter-item" data-cat="Classic Cars">Classic Cars</div>
                </div>
            </div>
        </aside>

        <main class="shop-main">
            <div class="product-grid" id="shopGrid"></div>
            <div id="paginationContainer" class="pagination-container"></div>
        </main>
    </section>

    <!-- SIDE CART PANEL -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel"></div>

    <!-- SCRIPTS -->
    <script src="data.js"></script>
    <script type="module">
        import { createProductCard, renderCartPanel, toggleCart, shuffleArray } from './ui.js';
        import { calculateCartTotals, updateQuantity } from './cart.js';

        window.wallify = {
            toggleCart,
            updateQty: (id, change) => {
                updateQuantity(id, change);
                renderCartPanel('cartPanel');
                updateGlobalBadges();
            }
        };

        function updateGlobalBadges() {
            const totals = calculateCartTotals();
            document.querySelectorAll('.cart-count').forEach(el => el.textContent = totals.totalItems);
        }

        let currentCategory = 'All';
        let searchQuery = '';

        function renderGrid() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            
            let filtered = products;
            if (currentCategory !== 'All') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (searchQuery) {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            // Shuffle for the "Random every refresh" requirement
            const displayList = shuffleArray(filtered);
            displayList.forEach(p => grid.appendChild(createProductCard(p)));
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGrid();
            
            // Listeners
            document.querySelectorAll('.filter-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.filter-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentCategory = item.getAttribute('data-cat');
                    renderGrid();
                });
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGrid();
            });

            document.getElementById('cartToggle').addEventListener('click', toggleCart);
            document.getElementById('cartOverlay').addEventListener('click', toggleCart);
            renderCartPanel('cartPanel');
            updateGlobalBadges();
        });
    </script>
</body>
</html>
