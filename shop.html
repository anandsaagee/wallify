<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All Collection | Wallify Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAV -->
    <nav class="navbar reveal">
        <div class="container nav-content">
            <a href="index.html" class="logo">Wallify<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="collections.html">Collections</a>
                <a href="shop.html" class="active">Shop</a>
            </div>
            <button class="cart-trigger" id="cartToggleBtn">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- SHOP HEADER -->
    <header class="py-120" style="margin-top: 70px; text-align: center; border-bottom: 1px solid var(--border-color); background: radial-gradient(circle at top center, rgba(30,30,30,1) 0%, var(--bg-color) 100%);">
        <div class="container reveal">
            <h1 class="section-title">The Poster Collection</h1>
            <p class="section-subtitle">Premium quality prints for your passion.</p>
        </div>
    </header>

    <!-- SHOP AREA -->
    <main class="container py-120" style="display: flex; flex-direction: column; gap: 40px;">
        <!-- Filters & Search -->
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 2rem;">
            <input type="text" id="searchInput" placeholder="Search posters..." style="flex-grow: 1; padding: 12px 20px; border-radius: 30px; background: rgba(255,255,255,0.05); color: #FFF; border: 1px solid var(--border-color);">
            <select id="catSelect" style="padding: 12px 20px; border-radius: 30px; background: rgba(255,255,255,0.05); color: #FFF; border: 1px solid var(--border-color);">
                <option value="All">All Categories</option>
                <option value="Automotive Posters">Automotive</option>
                <option value="Anime">Anime</option>
                <option value="Aesthetic">Aesthetic</option>
                <option value="Mollywood">Mollywood</option>
                <option value="Football">Football</option>
                <option value="Classic Cars">Classic Cars</option>
            </select>
        </div>

        <!-- Poster Grid (2 per row on mobile guaranteed via style.css) -->
        <div class="poster-grid" id="posterGrid">
            <!-- Dynamically populated -->
        </div>

        <!-- No Results Fallback -->
        <div id="emptyState" style="display: none; text-align: center; padding: 100px 20px; color: var(--text-muted);">
            <h3>No posters found matching your criteria.</h3>
            <button onclick="window.location.reload()" style="margin-top: 2rem; color: var(--accent-color); text-decoration: underline;">Reset Filters</button>
        </div>
    </main>

    <!-- SIDE CART -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel"></div>

    <!-- SCRIPTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script type="module">
        import { createPosterCard, renderCartPanel, toggleCart, shuffle } from './ui.js';
        import { calculateTotals } from './cart.js';

        let currentCategory = 'All';
        let searchQuery = '';

        function updateBadge() {
            const totals = calculateTotals();
            document.getElementById('cartBadge').textContent = totals.totalItems;
        }

        function renderGrid() {
            const grid = document.getElementById('posterGrid');
            const empty = document.getElementById('emptyState');
            if (!grid) return;

            let filtered = window.products || [];
            if (currentCategory !== 'All') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (searchQuery) {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
            } else {
                grid.style.display = 'grid';
                empty.style.display = 'none';
                
                // Shuffle for variety
                const displayList = shuffle(filtered);
                displayList.forEach(p => grid.appendChild(createPosterCard(p)));
            }

            // Trigger reveal animations
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Read URL params
            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('category');
            if (catParam) {
                currentCategory = catParam;
                document.getElementById('catSelect').value = catParam;
            }

            renderGrid();
            updateBadge();

            // Cart listeners
            document.getElementById('cartToggleBtn').addEventListener('click', () => toggleCart(true));
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
            renderCartPanel('cartPanel');

            // Category Change
            document.getElementById('catSelect').addEventListener('change', (e) => {
                currentCategory = e.target.value;
                const newUrl = currentCategory === 'All' ? 'shop.html' : `shop.html?category=${encodeURIComponent(currentCategory)}`;
                window.history.pushState({ cat: currentCategory }, '', newUrl);
                renderGrid();
            });

            // Search Change
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderGrid();
            });

            // Sync cart updates
            window.addEventListener('cart_sync', () => {
                updateBadge();
                renderCartPanel('cartPanel');
            });
        });
    </script>
</body>
</html>
