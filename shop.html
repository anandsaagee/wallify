<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container page-content">
        <div style="margin-bottom: 40px; text-align: center;">
            <h1 style="font-size: clamp(2rem, 8vw, 3rem); margin-bottom: 12px; line-height: 1.2;">The Collection</h1>
            <p style="color: var(--text-muted);">Curated prints for your modern lifestyle.</p>
        </div>

        <!-- Featured Categories (3 Sections) -->
        <div class="featured-categories" id="featuredCategories">
            <!-- Populated by JS -->
        </div>

        <!-- Filter & Search Bar -->
        <div class="glass filter-container">
            <div class="shop-filter-bar">
                
                <!-- Category Pills -->
                <div class="filter-tabs" id="categoryFilters">
                    <button class="filter-pill active" data-category="All">All</button>
                    <button class="filter-pill" data-category="Automotive">Automotive</button>
                    <button class="filter-pill" data-category="Mollywood">Mollywood</button>
                    <button class="filter-pill" data-category="Football">Football</button>
                    <button class="filter-pill" data-category="Anime">Anime</button>
                    <button class="filter-pill" data-category="Aesthetic">Aesthetic</button>
                    <button class="filter-pill" data-category="Classic Cars">Classic Cars</button>
                </div>

                <!-- Search & Sort -->
                <div class="shop-search-sort">
                    <div class="search-wrap">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search posters...">
                    </div>
                    <select id="sortSelect">
                        <option value="default" style="color: black;">Latest</option>
                        <option value="low" style="color: black;">Price: Low-High</option>
                        <option value="high" style="color: black;">Price: High-Low</option>
                        <option value="az" style="color: black;">Name: A-Z</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="resultsCount" style="margin-bottom: 24px; font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;"></div>

        <!-- Poster Grid -->
        <div class="poster-grid" id="productGrid">
            <!-- Shimmers / Skeleton while loading if needed, or JS will populate -->
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="margin-top: 60px; display: flex; justify-content: center; gap: 12px;"></div>
    </div>

    <!-- Modals & Cart -->
    <div id="productModal" class="modal"></div>
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script src="js/store.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            initializeStore({
                products: window.products,
                gridContainerId: 'productGrid',
                paginationContainerId: 'pagination',
                resultsCountId: 'resultsCount',
                filterSelector: '.filter-pill',
                searchInputId: 'searchInput',
                sortSelectId: 'sortSelect',
                itemsPerPage: 16
            });

            // Populate 3 Featured Sections
            const featuredCategories = [
                { name: 'Automotive', sub: 'High-Octane Art' },
                { name: 'Aesthetic', sub: 'Vibrant Modern Vibes' },
                { name: 'Mollywood', sub: 'Cinematic Legends' }
            ];

            const featuredContainer = document.getElementById('featuredCategories');
            if (featuredContainer) {
                featuredContainer.innerHTML = featuredCategories.map(cat => {
                    const catProducts = window.products.filter(p => p.category === cat.name);
                    // Use a random poster from the category as thumbnail
                    const randomPoster = catProducts[Math.floor(Math.random() * catProducts.length)];
                    return `
                        <div class="category-section-card reveal" onclick="document.querySelector('.filter-pill[data-category=\\'${cat.name}\\']').click(); window.scrollTo({top: document.getElementById('categoryFilters').offsetTop - 100, behavior: 'smooth'});">
                            <span class="category-tag-pill">${catProducts.length} Posters</span>
                            <img src="${randomPoster ? randomPoster.image : ''}" alt="${cat.name}" loading="lazy">
                            <div class="category-section-overlay">
                                <h3 class="category-section-title">${cat.name}</h3>
                                <p class="category-section-subtitle">${cat.sub}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));

            // Deep-link to category if present in URL
            const urlParams = new URLSearchParams(window.location.search);
            const initialCat = urlParams.get('category');
            if (initialCat) {
                const btn = document.querySelector(`.filter-pill[data-category="${initialCat}"]`);
                if (btn) btn.click();
            }
        });
    </script>
</body>
</html>
