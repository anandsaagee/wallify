<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Wallify Store</title>

<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* (your styles unchanged, kept clean) */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 32px;
}
.empty-state {
    text-align: center;
    padding: 80px 20px;
}
.pagination-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 60px;
}
.page-btn {
    min-width: 44px;
    height: 44px;
    cursor: pointer;
}
.page-btn.active {
    background: #fff;
    color: #000;
}
</style>
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">Wallify<span style="color:#FFF">.</span></a>
    <div class="nav-links">
        <a href="customize.html">Customize</a>
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
    </div>
</nav>

<header class="shop-header">
    <div class="container">
        <h1>The Collection</h1>
    </div>
</header>

<section class="container">

    <!-- SEARCH -->
    <input id="searchInput" placeholder="Search posters..." style="margin-bottom:20px;">

    <!-- FILTERS -->
    <div>
        <button class="filter-item active" data-cat="All">All</button>
        <button class="filter-item" data-cat="Automotive">Automotive</button>
        <button class="filter-item" data-cat="Anime">Anime</button>
        <button class="filter-item" data-cat="Aesthetic">Aesthetic</button>
    </div>

    <!-- SORT -->
    <select id="sortSelect" style="margin:20px 0;">
        <option value="default">Featured</option>
        <option value="low">Low to High</option>
        <option value="high">High to Low</option>
        <option value="az">A–Z</option>
    </select>

    <!-- RESULTS -->
    <p id="resultsCount"></p>

    <!-- GRID -->
    <div id="shopGrid" class="product-grid"></div>

    <!-- PAGINATION -->
    <div id="paginationContainer" class="pagination-container"></div>

</section>

<script src="./data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    if (typeof products === "undefined") {
        console.error("products not loaded");
        return;
    }

    let currentCategory = "All";
    let searchQuery = "";
    let currentSort = "default";
    let currentPage = 1;
    const itemsPerPage = 12;

    const grid = document.getElementById("shopGrid");
    const resultsCount = document.getElementById("resultsCount");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const filters = document.querySelectorAll(".filter-item");
    const pagination = document.getElementById("paginationContainer");

    function render() {

        let filtered = products.filter(p => {
            return (
                (currentCategory === "All" || p.category === currentCategory) &&
                p.title.toLowerCase().includes(searchQuery.toLowerCase())
            );
        });

        if (currentSort === "low") filtered.sort((a,b)=>a.basePrice-b.basePrice);
        if (currentSort === "high") filtered.sort((a,b)=>b.basePrice-a.basePrice);
        if (currentSort === "az") filtered.sort((a,b)=>a.title.localeCompare(b.title));

        resultsCount.textContent = filtered.length + " products";

        const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = 1;

        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filtered.slice(start, start + itemsPerPage);

        grid.innerHTML = "";

        if (pageItems.length === 0) {
            grid.innerHTML = "<p class='empty-state'>No products found</p>";
            return;
        }

        pageItems.forEach(p => {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.title}">
                    <h3>${p.title}</h3>
                    <p>₹${p.basePrice}</p>
                </div>
            `;
        });

        pagination.innerHTML = "";
        for (let i = 1; i <= totalPages; i++) {
            pagination.innerHTML += `
                <button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>
            `;
        }
    }

    window.goToPage = function (p) {
        currentPage = p;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    filters.forEach(f => {
        f.onclick = () => {
            filters.forEach(x=>x.classList.remove("active"));
            f.classList.add("active");
            currentCategory = f.dataset.cat;
            currentPage = 1;
            render();
        };
    });

    searchInput.oninput = e => {
        searchQuery = e.target.value;
        currentPage = 1;
        render();
    };

    sortSelect.onchange = e => {
        currentSort = e.target.value;
        render();
    };

    render();
});
</script>

</body>
</html>
