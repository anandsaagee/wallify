<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px;">
        <div style="margin-bottom: 40px; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 12px;">The Collection</h1>
            <p style="color: var(--text-muted);">Curated prints for your modern lifestyle.</p>
        </div>

        <!-- Filter & Search Bar -->
        <div class="glass" style="padding: 24px; border-radius: var(--radius-lg); margin-bottom: 40px; position: static; z-index: 100;">
            <div class="shop-filter-bar" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between;">
                
                <!-- Category Pills -->
                <div class="filter-tabs" id="categoryFilters">
                    <button class="filter-pill active" data-category="All">All</button>
                    <button class="filter-pill" data-category="Automotive">Automotive</button>
                    <button class="filter-pill" data-category="Mollywood">Mollywood</button>
                    <button class="filter-pill" data-category="Football">Football</button>
                    <button class="filter-pill" data-category="Anime">Anime</button>
                    <button class="filter-pill" data-category="Aesthetic">Aesthetic</button>
                    <button class="filter-pill" data-category="Classic Cars">Classic Cars</button>
                </div>

                <!-- Search & Sort -->
                <div class="shop-search-sort" style="display: flex; gap: 16px; flex-grow: 1; max-width: 500px;">
                    <div style="position: relative; flex-grow: 1;">
                        <i class="fas fa-search" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
                        <input type="text" id="searchInput" placeholder="Search posters..." style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 50px; padding: 12px 12px 12px 48px; color: white; outline: none; transition: 0.3s; font-family: inherit;">
                    </div>
                    <select id="sortSelect" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 50px; padding: 0 24px; color: white; outline: none; cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; min-height: 44px;">
                        <option value="default" style="color: black;">Latest</option>
                        <option value="low" style="color: black;">Price: Low-High</option>
                        <option value="high" style="color: black;">Price: High-Low</option>
                        <option value="az" style="color: black;">Name: A-Z</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="resultsCount" style="margin-bottom: 24px; font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;"></div>

        <!-- Poster Grid -->
        <div class="poster-grid" id="productGrid">
            <!-- Shimmers / Skeleton while loading if needed, or JS will populate -->
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="margin-top: 60px; display: flex; justify-content: center; gap: 12px;"></div>
    </div>

    <!-- Modals & Cart -->
    <div id="productModal" class="modal"></div>
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script src="js/store.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            initializeStore({
                products: window.products,
                gridContainerId: 'productGrid',
                paginationContainerId: 'pagination',
                resultsCountId: 'resultsCount',
                filterSelector: '.filter-pill',
                searchInputId: 'searchInput',
                sortSelectId: 'sortSelect',
                itemsPerPage: 16
            });

            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));

            // Deep-link to category if present in URL
            const urlParams = new URLSearchParams(window.location.search);
            const initialCat = urlParams.get('category');
            if (initialCat) {
                const btn = document.querySelector(`.filter-pill[data-category="${initialCat}"]`);
                if (btn) btn.click();
            }
        });
    </script>
</body>
</html>
