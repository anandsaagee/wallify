<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container page-content" id="cartPageContent">
        <!-- Rendered by JS -->
    </div>

    <!-- Modals & Cart -->
    <div id="cartPanel" class="cart-panel"></div>
    <div id="cartOverlay"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            const renderCartPage = () => {
                const totals = calculateTotals();
                const container = document.getElementById('cartPageContent');
                
                if (totals.items.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 100px 20px;">
                            <i class="fas fa-shopping-bag" style="font-size: 4rem; opacity: 0.1; margin-bottom: 24px;"></i>
                            <h2>Your bag is completely empty.</h2>
                            <a href="shop.html" class="btn btn-primary" style="margin-top: 24px;">Explore Collection</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div style="margin-bottom: 40px;">
                        <h1 style="font-size: 2.5rem;">Shopping Bag</h1>
                    </div>
                    <div class="responsive-grid-2col">
                        <div style="display: flex; flex-direction: column; gap: 24px;">
                            ${totals.items.map(item => `
                                <div class="glass" style="display: flex; gap: 24px; align-items: center;">
                                    <img src="${item.image}" style="width: 100px; height: 130px; object-fit: cover; border-radius: 12px;">
                                    <div style="flex-grow: 1;">
                                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                            <div>
                                                <h3 style="font-size: 1.1rem; margin-bottom: 4px;">${item.title}</h3>
                                                <p style="font-size: 0.85rem; color: var(--text-muted);">${item.category} • Size: ${item.size}</p>
                                            </div>
                                            <button onclick="window.removeItem('${item.variantId}')" style="color: var(--error); font-size: 0.9rem;"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                                            <div style="display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border-glass);">
                                                <button onclick="window.updateQty('${item.variantId}', -1)" style="color: white; font-weight: bold;">-</button>
                                                <span style="font-weight: 700;">${item.quantity}</span>
                                                <button onclick="window.updateQty('${item.variantId}', 1)" style="color: white; font-weight: bold;">+</button>
                                            </div>
                                            <span style="font-size: 1.25rem; font-weight: 800;">₹${item.price * item.quantity}</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="glass" style="height: fit-content; align-self: flex-start; position: sticky; top: 120px;">
                            <h2 style="font-size: 1.5rem; margin-bottom: 24px;">Order Summary</h2>
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                                    <span>Subtotal (${totals.totalItems} items)</span>
                                    <span>₹${totals.subtotal}</span>
                                </div>
                                ${totals.discount > 0 ? `
                                    <div style="display: flex; justify-content: space-between; color: var(--success); font-weight: 600;">
                                        <span>Bundle Discount</span>
                                        <span>-₹${totals.discount}</span>
                                    </div>
                                ` : ''}
                                <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                                    <span>Shipping</span>
                                    <span>FREE</span>
                                </div>
                                <div style="height: 1px; background: var(--border-glass); margin: 8px 0;"></div>
                                <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 800; color: var(--secondary);">
                                    <span>Total</span>
                                    <span>₹${totals.finalTotal}</span>
                                </div>

                                <div class="admin-badge">
                                    <p style="font-size: 0.8rem; color: var(--success); text-align: center;">🎉 You've unlocked <strong>${totals.freeCount} FREE</strong> posters with our bundle offer!</p>
                                </div>

                                <button onclick="window.location.href='checkout.html'" class="btn btn-primary" style="width: 100%; margin-top: 24px;">Proceed to Checkout</button>
                                <a href="shop.html" style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 16px; display: block;">Continue Shopping</a>
                            </div>
                        </div>
                    </div>
                `;
            };

            window.updateQty = (id, delta) => {
                updateQuantity(id, delta);
                renderCartPage();
                updateNavbarBadge();
            };

            window.removeItem = (id) => {
                removeFromCart(id);
                renderCartPage();
                updateNavbarBadge();
            };

            renderCartPage();
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
        });
    </script>
</body>
</html>
