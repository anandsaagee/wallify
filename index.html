<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/wallify-logo.jpg" />
    <link rel="apple-touch-icon" href="/wallify-logo.jpg" />
    <!-- Mobile-first viewport: no zoom, respects safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Premium Wall Posters – Film, Anime &amp; Car Art | Wallifystore</title>
    <meta name="description" content="Shop premium HD wall posters — film, anime &amp; car art. Fast Kerala delivery. Order now!" />
    <meta name="google-site-verification" content="ldqcMKUQvr5zeHdI827JxW_Zmv1VaX317fQMpU5ATVU" />

    <!-- PWA / browser chrome -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WallifyStore" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WallifyStore — Premium Poster Store" />
    <meta property="og:description" content="Transform your walls with premium posters at unbeatable prices." />
    <meta property="og:image" content="/wallify-logo.jpg" />

    <!-- DNS / connection prefetch for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload primary font (DM Serif Display) + secondary (DM Sans) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
