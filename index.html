<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallify Store | Premium Posters</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Hero Custom ───────────────────────────── */
        .hero {
            height: clamp(500px, 100svh, 800px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: #050505;
        }

        .hero-bg {
            position: absolute; inset: 0; z-index: 0; display: flex; flex-direction: column; 
            justify-content: space-around; pointer-events: none; opacity: 0; transition: opacity 1.5s ease;
        }
        .hero-bg.loaded { opacity: 0.5; }

        .hero-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: radial-gradient(circle at 50% 50%, rgba(5,5,5,0.3) 0%, rgba(5,5,5,0.75) 100%);
            pointer-events: none;
        }

        .hero-content {
            position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; 
            max-width: 860px; width: 100%; margin: 0 auto; padding: 0 1.25rem;
        }
        .hero-content h1 { font-size: clamp(2.5rem, 10vw, 5.5rem); margin-bottom: 1.5rem; text-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .hero-content p { font-size: clamp(1rem, 3.5vw, 1.4rem); color: var(--text-muted); margin-bottom: 2.5rem; max-width: 500px; }

        .track-row { display: flex; gap: 20px; animation: scrollRow 80s linear infinite; }
        @keyframes scrollRow { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .track-item { width: 180px; height: 240px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .track-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav class="navbar reveal">
        <div class="container nav-content">
            <a href="index.html" class="logo">Wallify<span>.</span></a>
            <div class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="collections.html">Collections</a>
                <a href="shop.html">Shop</a>
            </div>
            <button class="cart-trigger" id="cartToggleBtn">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-bg" id="heroBg">
            <div class="track-row" id="heroTrack"></div>
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="reveal">Gallery for Your Space</h1>
            <p class="reveal-delay-1">Experience museum-grade fine art prints curated for modern passion.</p>
            <div class="reveal-delay-2">
                <a href="shop.html" class="btn-primary" style="padding: 1rem 2.5rem; font-size: 1.1rem;">Explore All&nbsp;<i class="fas fa-arrow-right"></i></a>
            </div>
        </div>
    </header>

    <!-- COLLECTIONS GRID -->
    <section class="container py-120">
        <h2 class="section-title reveal">Categories</h2>
        <p class="section-subtitle reveal">Hand-picked art sorted by your passion.</p>

        <!-- Guarantee 2 per row via poster-grid in style.css -->
        <div class="poster-grid">
            <a href="shop.html?category=Automotive Posters" class="poster-card reveal">
                <img src="assets/automotive/AM%20%20001.jpg" alt="Automotive">
                <div class="card-body">
                    <span class="card-category">Speed</span>
                    <h3 class="card-title">Automotive</h3>
                </div>
            </a>
            <a href="shop.html?category=Anime" class="poster-card reveal">
                <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&q=80&w=1000" alt="Anime">
                <div class="card-body">
                    <span class="card-category">Epic</span>
                    <h3 class="card-title">Anime</h3>
                </div>
            </a>
            <a href="shop.html?category=Aesthetic" class="poster-card reveal">
                <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&q=80&w=1000" alt="Aesthetic">
                <div class="card-body">
                    <span class="card-category">Vibe</span>
                    <h3 class="card-title">Aesthetic</h3>
                </div>
            </a>
            <a href="shop.html?category=Mollywood" class="poster-card reveal">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&q=80&w=1600" alt="Mollywood">
                <div class="card-body">
                    <span class="card-category">Cinema</span>
                    <h3 class="card-title">Mollywood</h3>
                </div>
            </a>
        </div>
    </section>

    <!-- SIDE CART -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel"></div>

    <!-- SCRIPTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script type="module">
        import { renderCartPanel, toggleCart, shuffle } from './ui.js';
        import { calculateTotals } from './cart.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Cart Setup
            document.getElementById('cartToggleBtn').addEventListener('click', () => toggleCart(true));
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
            
            function updateSync() {
                const totals = calculateTotals();
                document.getElementById('cartBadge').textContent = totals.totalItems;
                renderCartPanel('cartPanel');
            }
            
            updateSync();
            window.addEventListener('cart_sync', updateSync);

            // Hero Background
            const track = document.getElementById('heroTrack');
            const bg = document.getElementById('heroBg');
            if (window.products && track) {
                const items = shuffle(window.products).slice(0, 15);
                const loopItems = [...items, ...items];
                track.innerHTML = loopItems.map(p => `
                    <div class="track-item"><img src="${p.image}" alt="${p.title}" loading="lazy"></div>
                `).join('');
                setTimeout(() => bg.classList.add('loaded'), 500);
            }

            // Reveal Animation
            setTimeout(() => {
                document.querySelectorAll('.reveal, .reveal-delay-1, .reveal-delay-2').forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>
</html>
