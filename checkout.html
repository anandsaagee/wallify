<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Wallify Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-page { padding: 160px 0 100px; }
        .checkout-layout { display: grid; grid-template-columns: 3fr 2fr; gap: 60px; align-items: start; }
        .checkout-form {
            background: var(--surface-color);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(15px);
        }
        .form-section { margin-bottom: 40px; }
        .form-section h3 {
            font-size: 1.6rem; margin-bottom: 30px; padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1); color: #FFF;
        }
        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block; margin-bottom: 8px; color: var(--text-muted);
            font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .form-control {
            width: 100%; padding: 16px 20px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); color: #FFF;
            border-radius: 12px; font-family: inherit; font-size: 1.05rem;
        }
        .order-summary {
            background: rgba(255,255,255,0.02);
            padding: 40px 32px; border-radius: 20px;
            border: 1px solid var(--border-color);
            position: sticky; top: 120px;
            backdrop-filter: blur(20px);
        }
        .checkout-item {
            display: flex; gap: 20px; margin-bottom: 24px; padding-bottom: 24px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .checkout-item img { width: 70px; height: 90px; object-fit: cover; border-radius: 8px; }
        .checkout-item-details h4 { font-size: 1.1rem; color: #FFF; margin-bottom: 4px; }
        .checkout-item-meta { font-size: 0.85rem; color: var(--text-muted); }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .summary-row.total {
            margin-top: 24px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 1.5rem; font-weight: 700; color: var(--accent-color);
        }
        .discount-row { color: #50fa7b; }

        .submit-btn {
            width: 100%; margin-top: 24px; padding: 18px; border-radius: 30px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #FFF; border: none; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        @media (max-width: 900px) {
            .checkout-layout { grid-template-columns: 1fr; }
            .order-summary { position: relative; top: 0; }
        }
    </style>
</head>
<body>

    <nav class="navbar reveal">
        <a href="index.html" class="logo">Wallify<span style="color:#FFF;">.</span></a>
        <div class="nav-links">
            <a href="shop.html" style="color:var(--text-main); font-size:1rem;"><i class="fas fa-arrow-left"></i> Back to Shop</a>
        </div>
    </nav>

    <main class="container checkout-page">
        <div class="checkout-layout">
            <form id="checkoutForm" class="checkout-form">
                <div class="form-section">
                    <h3>Confirm Details</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="custName" class="form-control" required placeholder="anand">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="custPhone" class="form-control" required placeholder="+91 94972 42251">
                    </div>
                </div>
                <div class="form-section">
                    <h3>Shipping Address</h3>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="custAddress" class="form-control" required rows="3" placeholder="123, Street Name, City, State"></textarea>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="sendOrderBtn">
                    Place Order via WhatsApp <i class="fab fa-whatsapp"></i>
                </button>
            </form>

            <aside class="order-summary" id="orderSummary">
                <!-- Populated by JS -->
            </aside>
        </div>
    </main>

    <script type="module">
        import { getCart, calculateCartTotals, saveCart } from './cart.js';

        const WA_NUMBER = "917736497186";

        function renderSummary() {
            const cart = getCart();
            const totals = calculateCartTotals();
            const container = document.getElementById('orderSummary');

            container.innerHTML = `
                <h3>Order Overview</h3>
                <div class="items-list">
                    ${cart.map(item => `
                        <div class="checkout-item">
                            <img src="${item.image}" alt="${item.title}">
                            <div class="checkout-item-details">
                                <h4>${item.title}</h4>
                                <p class="checkout-item-meta">${item.size} | Qty: ${item.quantity}</p>
                                <p class="checkout-item-price">₹${item.price * item.quantity}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="totals-box">
                    <div class="summary-row"><span>Subtotal</span><span>₹${totals.subtotal}</span></div>
                    ${totals.numFree > 0 ? `<div class="summary-row discount-row"><span>Bundle Offer (${totals.numFree} Free)</span><span>- ₹${totals.discount}</span></div>` : ''}
                    <div class="summary-row total"><span>Grand Total</span><span>₹${totals.totalPayable}</span></div>
                </div>
            `;
        }

        document.getElementById('checkoutForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const cart = getCart();
            const totals = calculateCartTotals();
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            // Generate WhatsApp message
            let msg = `🛍️ *NEW ORDER - WALLIFY STORE*\n\n`;
            msg += `👤 *Customer:* ${name}\n`;
            msg += `📞 *Phone:* ${phone}\n`;
            msg += `📍 *Address:* ${address}\n\n`;
            msg += `📦 *Items:* \n`;
            
            cart.forEach(item => {
                msg += `- ${item.title} (${item.size}) x${item.quantity} = ₹${item.price * item.quantity}\n`;
            });

            msg += `\n💰 *Subtotal:* ₹${totals.subtotal}\n`;
            if(totals.numFree > 0) msg += `🎁 *Discount:* -₹${totals.discount} (${totals.numFree} Posters Free!)\n`;
            msg += `✅ *Total Payable:* ₹${totals.totalPayable}\n\n`;
            msg += `_Please confirm my order. Thank you!_`;

            const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
            
            // Clear cart and redirect
            localStorage.removeItem('wallifyCart');
            window.open(waUrl, '_blank');
            window.location.href = 'index.html';
        });

        document.addEventListener('DOMContentLoaded', renderSummary);
    </script>
</body>
</html>
