<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Wallify Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar scrolled"></nav>

    <div class="container" style="padding-top: 120px; padding-bottom: 80px;">
        <div style="text-align: center; margin-bottom: 60px;">
            <h1 style="font-size: 2.5rem; margin-bottom: 12px;">Complete Your Order</h1>
            <p style="color: var(--text-muted);">Please provide your shipping details to proceed to WhatsApp.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; @media(max-width: 900px){ grid-template-columns: 1fr; }">
            
            <!-- Shipping Form -->
            <div class="glass reveal" style="padding: 40px; border-radius: var(--radius-lg);">
                <h2 style="font-size: 1.5rem; margin-bottom: 24px;">Shipping Details</h2>
                <form id="checkoutForm" style="display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Full Name</label>
                        <input type="text" id="name" required placeholder="Enter your full name" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 12px; padding: 14px; color: white; outline: none; transition: 0.3s; font-family: inherit;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="Enter your WhatsApp number" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 12px; padding: 14px; color: white; outline: none; transition: 0.3s; font-family: inherit;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Full Address</label>
                        <textarea id="address" required placeholder="House No, Street, Landmark, City, State" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 12px; padding: 14px; color: white; outline: none; transition: 0.3s; font-family: inherit; resize: none; height: 100px;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Pincode</label>
                        <input type="text" id="pincode" required placeholder="Enter 6-digit Pincode" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); border-radius: 12px; padding: 14px; color: white; outline: none; transition: 0.3s; font-family: inherit;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; background: #25D366; border-color: #25D366;">
                        Order on WhatsApp <i class="fab fa-whatsapp"></i>
                    </button>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="reveal" style="display: flex; flex-direction: column; gap: 24px;">
                <div class="glass" style="padding: 32px; border-radius: var(--radius-lg);">
                    <h2 style="font-size: 1.25rem; margin-bottom: 24px;">Review Selection</h2>
                    <div id="checkoutItems" style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- Populate with JS -->
                    </div>
                    <div style="height: 1px; background: var(--border-glass); margin: 24px 0;"></div>
                    <div id="checkoutTotals">
                        <!-- Populate with JS -->
                    </div>
                    <div class="glass" style="margin-top: 24px; padding: 16px; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.2); background: rgba(16, 185, 129, 0.05);">
                        <p style="font-size: 0.8rem; color: var(--success); text-align: center;">By clicking "Order on WhatsApp", you'll be redirected to send your order details directly to us.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('shop');
            initScrollReveal();

            const totals = calculateTotals();
            if (totals.items.length === 0) {
                window.location.href = 'shop.html';
                return;
            }

            // Populate Items
            const itemsContainer = document.getElementById('checkoutItems');
            itemsContainer.innerHTML = totals.items.map(item => `
                <div style="display: flex; justify-content: space-between; font-size: 0.95rem;">
                    <span style="color: var(--text-muted);">${item.quantity}x ${item.title} (${item.size})</span>
                    <span style="font-weight: 700;">₹${item.price * item.quantity}</span>
                </div>
            `).join('');

            // Populate Totals
            const totalsContainer = document.getElementById('checkoutTotals');
            totalsContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 8px;">
                    <span>Subtotal</span>
                    <span>₹${totals.subtotal}</span>
                </div>
                ${totals.discount > 0 ? `
                    <div style="display: flex; justify-content: space-between; color: var(--success); font-weight: 600; margin-bottom: 8px;">
                        <span>Bundle Discount</span>
                        <span>-₹${totals.discount}</span>
                    </div>
                ` : ''}
                <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 800; color: var(--secondary); margin-top: 8px;">
                    <span>Total Payable</span>
                    <span>₹${totals.finalTotal}</span>
                </div>
            `;

            // Form Submit
            document.getElementById('checkoutForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const customer = {
                    name: document.getElementById('name').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    pincode: document.getElementById('pincode').value
                };

                const waUrl = formatWhatsAppMessage(customer);
                window.open(waUrl, '_blank');
            });
        });
    </script>
</body>
</html>
