<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Wallify Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAV -->
    <nav class="navbar reveal">
        <div class="container nav-content">
            <a href="index.html" class="logo">Wallify<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="collections.html">Collections</a>
                <a href="shop.html">Shop</a>
            </div>
            <button class="cart-trigger" id="cartToggleBtn">
                <i class="fas fa-shopping-bag"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="container py-120" style="margin-top: 70px; max-width: 600px;">
        <h1 class="section-title">Complete Your Order</h1>
        <p class="section-subtitle">Confirm your final selection and place order via WhatsApp.</p>

        <div id="checkoutSummary" style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; margin-bottom: 2.5rem;">
            <!-- Summary renders here -->
        </div>

        <button id="placeOrderBtn" class="btn-primary" style="width: 100%; padding: 20px; font-size: 1.1rem; border-radius: 40px; background: #25D366; color: #FFF; border: none; box-shadow: 0 10px 30px rgba(37,211,102,0.3);">
            Place Order on WhatsApp <i class="fab fa-whatsapp" style="margin-left: 8px;"></i>
        </button>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="shop.html" style="color: var(--text-muted); font-size: 0.9rem;">Wait, I want more posters</a>
        </div>
    </main>

    <!-- SIDE CART -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel"></div>

    <!-- SCRIPTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="data.js"></script>
    <script type="module">
        import { getCart, calculateTotals } from './cart.js';
        import { renderCartPanel, toggleCart } from './ui.js';

        document.addEventListener('DOMContentLoaded', () => {
            const summary = document.getElementById('checkoutSummary');
            const cart = getCart();
            const totals = calculateTotals();

            if (cart.length === 0) {
                window.location.href = 'shop.html';
                return;
            }

            summary.innerHTML = `
                <div style="margin-bottom: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; color: #FFF;">Order Summary</h3>
                    ${cart.map(item => `
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.75rem;">
                            <span>${item.quantity}x ${item.title} (${item.size})</span>
                            <span style="color: var(--text-muted);">₹${item.price * item.quantity}</span>
                        </div>
                    `).join('')}
                </div>
                <div style="border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-muted);">
                        <span>Subtotal</span>
                        <span>₹${totals.subtotal}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: #50fa7b;">
                        <span>Bundle Free Posters</span>
                        <span>- ₹${totals.discount}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 1.4rem; font-weight: 800; color: var(--accent-color);">
                        <span>Total Payable</span>
                        <span>₹${totals.totalPayable}</span>
                    </div>
                </div>
            `;

            document.getElementById('placeOrderBtn').addEventListener('click', () => {
                const itemsText = cart.map(i => `- ${i.quantity}x ${i.title} [${i.size}] (₹${i.price * i.quantity})`).join('\n');
                const message = encodeURIComponent(`Hi, I'd like to place an order:

MY SELECTION:
${itemsText}

------------------------
SUBTOTAL: ₹${totals.subtotal}
BUNDLE DISCOUNT: - ₹${totals.discount}
TOTAL PAYABLE: ₹${totals.totalPayable}

Please let me know the payment details.`);
                
                window.open(`https://wa.me/919497242251?text=${message}`);
            });

            // Cart Setup for Nav
            document.getElementById('cartToggleBtn').addEventListener('click', () => toggleCart(true));
            document.getElementById('cartOverlay').addEventListener('click', () => toggleCart(false));
            renderCartPanel('cartPanel');
            document.getElementById('cartBadge').textContent = totals.totalItems;
        });
    </script>
</body>
</html>
